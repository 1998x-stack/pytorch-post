<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">AOTAutograd：联合图、前反向分区与保存值</title><desc id="figure-desc">联合图包含 sin、mul、sum 和它们的导数操作。 forward FX 返回 loss、x、sin(x)，其中后两者为保存值。 backward FX 接收 x、sin(x)、输出 tangent，返回输入梯度。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g class="diagram-node"><rect x="165" y="8" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="32" font-size="16" font-weight="600" text-anchor="middle">联合前反向图</text><text x="290" y="53" font-size="14" text-anchor="middle">joint FX</text></g><g class="diagram-node"><rect x="165" y="100" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="124" font-size="16" font-weight="600" text-anchor="middle">partition_fn</text><text x="290" y="145" font-size="14" text-anchor="middle">default_partition</text></g><g class="diagram-node"><rect x="18" y="200" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="143" y="224" font-size="16" font-weight="600" text-anchor="middle">forward FX</text><text x="143" y="245" font-size="14" text-anchor="middle">loss, x, sin</text></g><g class="diagram-node"><rect x="312" y="200" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="437" y="224" font-size="16" font-weight="600" text-anchor="middle">backward FX</text><text x="437" y="245" font-size="14" text-anchor="middle">x, sin, tangent</text></g><g class="diagram-node"><rect x="165" y="305" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="329" font-size="16" font-weight="600" text-anchor="middle">eager 对照</text><text x="290" y="350" font-size="14" text-anchor="middle">梯度一致</text></g><path d="M290 70 V100" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M245 162 L143 200" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M335 162 L437 200" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M268 231 H312" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M437 262 L345 305" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/></g></svg>
