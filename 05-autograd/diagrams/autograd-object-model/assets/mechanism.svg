<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 406" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Autograd 对象模型：Tensor、AutogradMeta、Node 与 Edge</title><desc id="figure-desc">u 和 v 共用 UnbindBackward0；output_nr = 0 与 1。 输入槽 0 收到 3，槽 1 收到 4；UnbindBackward0 还原 [3,4]。 MulBackward0 将 [3,4] 乘 2，叶子 x.grad = [6,8]。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g id="step-node-0" class="diagram-node"><rect x="20" y="8" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140" y="33" font-size="16" font-weight="600" text-anchor="middle">u / output 0</text><text x="140" y="55" font-size="14" text-anchor="middle">grad 3</text></g><g id="step-node-1" class="diagram-node"><rect x="320" y="8" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="440" y="33" font-size="16" font-weight="600" text-anchor="middle">v / output 1</text><text x="440" y="55" font-size="14" text-anchor="middle">grad 4</text></g><g id="step-node-2" class="diagram-node"><rect x="170" y="112" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="137" font-size="16" font-weight="600" text-anchor="middle">UnbindBackward0</text><text x="290" y="159" font-size="14" text-anchor="middle">input slots: 0, 1</text></g><g id="step-node-3" class="diagram-node"><rect x="170" y="220" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="245" font-size="16" font-weight="600" text-anchor="middle">MulBackward0</text><text x="290" y="267" font-size="14" text-anchor="middle">[3,4] × 2</text></g><g id="step-node-4" class="diagram-node"><rect x="170" y="328" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="353" font-size="16" font-weight="600" text-anchor="middle">AccumulateGrad</text><text x="290" y="375" font-size="14" text-anchor="middle">x.grad = [6,8]</text></g><path d="M140 72 L240 112" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M440 72 L340 112" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M290 176 V220" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M290 284 V328" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/></g></svg>
