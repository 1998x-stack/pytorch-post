<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 305" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Autograd 并发：ReadyQueue、重入与 CUDA Stream</title><desc id="figure-desc">线程 A、B 各自拥有独立图，梯度为 4、6。 外层 node 调用内层 grad；重入处理避免队列进度被阻塞，示例梯度 6。 生产者 stream → event / wait → 消费者 stream（仅源码机制，未实测 GPU）。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g class="diagram-node"><rect x="18" y="10" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="143" y="34" font-size="16" font-weight="600" text-anchor="middle">CPU task A</text><text x="143" y="55" font-size="14" text-anchor="middle">独立图 x=2</text></g><g class="diagram-node"><rect x="312" y="10" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="437" y="34" font-size="16" font-weight="600" text-anchor="middle">CPU task B</text><text x="437" y="55" font-size="14" text-anchor="middle">独立图 x=3</text></g><g class="diagram-node"><rect x="18" y="120" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="143" y="144" font-size="16" font-weight="600" text-anchor="middle">外层 backward</text><text x="143" y="165" font-size="14" text-anchor="middle">调用内层 grad</text></g><g class="diagram-node"><rect x="312" y="120" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="437" y="144" font-size="16" font-weight="600" text-anchor="middle">内层 GraphTask</text><text x="437" y="165" font-size="14" text-anchor="middle">返回梯度</text></g><g class="diagram-node"><rect x="165" y="230" width="250" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="254" font-size="16" font-weight="600" text-anchor="middle">设备 stream</text><text x="290" y="275" font-size="14" text-anchor="middle">event / wait</text></g><path d="M268 151 H312" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="290" y="101" font-size="13" text-anchor="middle">独立任务 / 重入任务</text><text x="290" y="213" font-size="13" text-anchor="middle">另一个层面：设备同步</text></g></svg>
