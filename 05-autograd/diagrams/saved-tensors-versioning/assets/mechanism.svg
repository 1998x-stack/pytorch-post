<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 335" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">保存版本与共享别名</title><desc id="diagram-desc">实数标量示例，箭头表示依赖或梯度流，文字给出节点含义及数值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g fill="#203035" font-family="system-ui, sans-serif"><rect x="25" y="16" width="245" height="60" rx="9" fill="#7461ba" fill-opacity=".09" stroke="#7461ba" stroke-width="2"/><text x="147.5" y="40" text-anchor="middle" font-size="16" font-weight="600">SavedVariable</text><text x="147.5" y="59" text-anchor="middle" font-size="13">saved = 0</text><rect x="310" y="16" width="245" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="432.5" y="40" text-anchor="middle" font-size="16" font-weight="600">原张量 x</text><text x="432.5" y="59" text-anchor="middle" font-size="13">current = 0</text><rect x="310" y="118" width="245" height="60" rx="9" fill="#d06d4d" fill-opacity=".09" stroke="#d06d4d" stroke-width="2"/><text x="432.5" y="142" text-anchor="middle" font-size="16" font-weight="600">detach 别名</text><text x="432.5" y="161" text-anchor="middle" font-size="13">共享存储 / 版本</text><rect x="25" y="118" width="245" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="147.5" y="142" text-anchor="middle" font-size="16" font-weight="600">独立 clone</text><text x="147.5" y="161" text-anchor="middle" font-size="13">独立存储 / 版本</text><path d="M432 76 V118" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M310 45 H270" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M310 147 H275" fill="none" stroke="#d06d4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="214" text-anchor="middle" font-size="17">修改共享别名 → current = 1</text><rect x="120" y="240" width="340" height="58" rx="9" fill="#d06d4d" fill-opacity=".09" stroke="#d06d4d" stroke-width="2"/><text x="290" y="264" text-anchor="middle" font-size="16" font-weight="600">unpack 版本比较</text><text x="290" y="283" text-anchor="middle" font-size="13">0 ≠ 1 → 拒绝</text></g></svg>
