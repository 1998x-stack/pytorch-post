<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Activation Checkpoint：重计算、早停与 RNG</title><desc id="figure-desc">普通：enter→exit，一次 forward；梯度 [32,108]。 non-reentrant：enter→exit→enter，在本例最后一次 exit 前早停；梯度一致。 reentrant：enter→exit→enter→exit，完整重算；梯度一致。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g class="diagram-node"><rect x="168" y="8" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="32" font-size="16" font-weight="600" text-anchor="middle">输入 x</text><text x="290.5" y="53" font-size="14" text-anchor="middle">[2,3]</text></g><g class="diagram-node"><rect x="168" y="100" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="124" font-size="16" font-weight="600" text-anchor="middle">a = x²</text><text x="290.5" y="145" font-size="14" text-anchor="middle">[4,9]</text></g><g class="diagram-node"><rect x="168" y="192" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="216" font-size="16" font-weight="600" text-anchor="middle">y = a²</text><text x="290.5" y="237" font-size="14" text-anchor="middle">[16,81]</text></g><g class="diagram-node"><rect x="18" y="295" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140.5" y="319" font-size="16" font-weight="600" text-anchor="middle">重计算 a / 保存值</text><text x="140.5" y="340" font-size="14" text-anchor="middle">按需或完整重跑</text></g><g class="diagram-node"><rect x="317" y="295" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="439.5" y="319" font-size="16" font-weight="600" text-anchor="middle">backward</text><text x="439.5" y="340" font-size="14" text-anchor="middle">[32,108]</text></g><path d="M290 70 V100" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M290 162 V192" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M230 254 L140 295" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M340 254 L439 295" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M263 326 H317" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/></g></svg>
