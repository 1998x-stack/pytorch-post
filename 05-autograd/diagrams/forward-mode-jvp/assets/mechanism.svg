<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Forward-mode AD：Dual Tensor 与 JVP</title><desc id="figure-desc">x=[2,3]，v=[4,5]，dual 携带原值和 tangent。 乘积：4×3+2×5=22；和：4+5=9。 primal=[6,5]，JVP=[22,9]；退出 dual level 后 tangent 清除。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g class="diagram-node"><rect x="18" y="10" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140.5" y="34" font-size="16" font-weight="600" text-anchor="middle">x₁ = 2</text><text x="140.5" y="55" font-size="14" text-anchor="middle">tangent 4</text></g><g class="diagram-node"><rect x="317" y="10" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="439.5" y="34" font-size="16" font-weight="600" text-anchor="middle">x₂ = 3</text><text x="439.5" y="55" font-size="14" text-anchor="middle">tangent 5</text></g><g class="diagram-node"><rect x="18" y="118" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140.5" y="142" font-size="16" font-weight="600" text-anchor="middle">乘积 x₁x₂</text><text x="140.5" y="163" font-size="14" text-anchor="middle">primal 6 / tangent 22</text></g><g class="diagram-node"><rect x="317" y="118" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="439.5" y="142" font-size="16" font-weight="600" text-anchor="middle">和 x₁+x₂</text><text x="439.5" y="163" font-size="14" text-anchor="middle">primal 5 / tangent 9</text></g><g class="diagram-node"><rect x="168" y="225" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="249" font-size="16" font-weight="600" text-anchor="middle">f 与 Jv</text><text x="290.5" y="270" font-size="14" text-anchor="middle">[6,5] / [22,9]</text></g><path d="M140 72 V118" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M439 72 V118" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M140 72 L439 118" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M439 72 L140 118" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M140 180 L230 225" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M439 180 L350 225" stroke="#53676d" stroke-width="2" fill="none" marker-end="url(#arr)"/></g></svg>
