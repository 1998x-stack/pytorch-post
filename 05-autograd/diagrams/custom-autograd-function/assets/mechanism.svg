<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 406" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Custom Autograd Function：定义自己的 VJP 与二阶梯度</title><desc id="figure-desc">输入 [2,-1]，scale=2；forward → [16,-2]，ctx 保存 x。 输出余切为 [1,1]；backward → [24,6]，scale 返回 None。 create_graph=True 后再次微分 → [24,-12]；gradgradcheck 通过。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g id="step-node-0" class="diagram-node"><rect x="170" y="8" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="33" font-size="16" font-weight="600" text-anchor="middle">Function.apply</text><text x="290" y="55" font-size="14" text-anchor="middle">x = [2,-1]</text></g><g id="step-node-1" class="diagram-node"><rect x="20" y="110" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140" y="135" font-size="16" font-weight="600" text-anchor="middle">ctx.save_for_backward</text><text x="140" y="157" font-size="14" text-anchor="middle">保存输入 x</text></g><g id="step-node-2" class="diagram-node"><rect x="320" y="110" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="440" y="135" font-size="16" font-weight="600" text-anchor="middle">PyNode / forward</text><text x="440" y="157" font-size="14" text-anchor="middle">y = [16,-2]</text></g><g id="step-node-3" class="diagram-node"><rect x="170" y="224" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="249" font-size="16" font-weight="600" text-anchor="middle">backward(g)</text><text x="290" y="271" font-size="14" text-anchor="middle">gx = [24,6]</text></g><g id="step-node-4" class="diagram-node"><rect x="170" y="330" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="355" font-size="16" font-weight="600" text-anchor="middle">double backward</text><text x="290" y="377" font-size="14" text-anchor="middle">[24,-12]</text></g><path d="M250 72 L140 110" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M330 72 L440 110" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M140 174 L250 224" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M440 174 L330 224" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/><path d="M290 288 V330" fill="none" stroke="#53676d" stroke-width="2" marker-end="url(#arr)"/></g></svg>
