<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">高阶自动微分：Hessian、HVP 与 create_graph</title><desc id="figure-desc">f 在 (2,3) 的梯度是 [15,8]。 H=[[12,1],[1,2]]，对称矩阵。 v=[4,5]：Hv=[53,14]；两种组合一致。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g class="diagram-node"><rect x="168" y="8" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="32" font-size="16" font-weight="600" text-anchor="middle">f(x)</text><text x="290.5" y="53" font-size="14" text-anchor="middle">标量输出</text></g><g class="diagram-node"><rect x="168" y="100" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="124" font-size="16" font-weight="600" text-anchor="middle">∇f(x)</text><text x="290.5" y="145" font-size="14" text-anchor="middle">[15,8]</text></g><g class="diagram-node"><rect x="18" y="195" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140.5" y="219" font-size="16" font-weight="600" text-anchor="middle">Hessian H</text><text x="140.5" y="240" font-size="14" text-anchor="middle">[[12,1],[1,2]]</text></g><g class="diagram-node"><rect x="317" y="195" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="439.5" y="219" font-size="16" font-weight="600" text-anchor="middle">JVP of grad</text><text x="439.5" y="240" font-size="14" text-anchor="middle">forward-over-reverse</text></g><g class="diagram-node"><rect x="168" y="295" width="245" height="62" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290.5" y="319" font-size="16" font-weight="600" text-anchor="middle">H v</text><text x="290.5" y="340" font-size="14" text-anchor="middle">[53,14]</text><