<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 406" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">derivatives.yaml：从导数规则到自动生成反向算子</title><desc id="figure-desc">mul.Tensor schema 对应 derivatives.yaml 中两个输入 VJP 规则。 构建阶段生成 Autograd wrapper 和反向 Node；并非运行时解释 YAML。 MulBackward0 计算候选梯度，元数据将广播结果归约到 [2,1] 与 [1,3]。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g font-family="system-ui,sans-serif" fill="#203035"><g id="step-node-0" class="diagram-node"><rect x="20" y="8" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="140" y="33" font-size="16" font-weight="600" text-anchor="middle">native_functions.yaml</text><text x="140" y="55" font-size="14" text-anchor="middle">mul.Tensor schema</text></g><g id="step-node-1" class="diagram-node"><rect x="320" y="8" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="440" y="33" font-size="16" font-weight="600" text-anchor="middle">derivatives.yaml</text><text x="440" y="55" font-size="14" text-anchor="middle">self / other VJP</text></g><g id="step-node-2" class="diagram-node"><rect x="170" y="112" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="137" font-size="16" font-weight="600" text-anchor="middle">load_derivatives</text><text x="290" y="159" font-size="14" text-anchor="middle">differentiability info</text></g><g id="step-node-3" class="diagram-node"><rect x="170" y="220" width="240" height="64" rx="10" fill="#f3f9f6" stroke="#147f80" stroke-width="2"/><text x="290" y="245" font-size="16" font-weight="600" text-anchor="middle">gen_autograd</text><text x="290" y="267" font-size="14" text-anchor="middle">wrapper + Node</text></g><g id="step-node-4" class="diagram-node"><rect x="170" y="328" width="240" height="64" rx="10" fill="#f3f9f6" s