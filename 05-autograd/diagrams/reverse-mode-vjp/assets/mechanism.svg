<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 335" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">前向分叉与反向贡献</title><desc id="diagram-desc">实数标量示例，箭头表示依赖或梯度流，文字给出节点含义及数值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#53676d"/></marker></defs><g fill="#203035" font-family="system-ui, sans-serif"><rect x="215" y="15" width="150" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="290" y="39" text-anchor="middle" font-size="16" font-weight="600">x = 2</text><text x="290" y="58" text-anchor="middle" font-size="13">输入标量</text><rect x="35" y="118" width="190" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="130" y="142" text-anchor="middle" font-size="16" font-weight="600">a = x × x</text><text x="130" y="161" text-anchor="middle" font-size="13">值 4；局部导数 4</text><rect x="355" y="118" width="190" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="450" y="142" text-anchor="middle" font-size="16" font-weight="600">b = 3x</text><text x="450" y="161" text-anchor="middle" font-size="13">值 6；局部导数 3</text><rect x="215" y="225" width="150" height="60" rx="9" fill="#147f80" fill-opacity=".09" stroke="#147f80" stroke-width="2"/><text x="290" y="249" text-anchor="middle" font-size="16" font-weight="600">L = a + b</text><text x="290" y="268" text-anchor="middle" font-size="13">值 10</text><path d="M248 75 L144 118" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M332 75 L436 118" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M144 178 L248 225" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M436 178 L332 225" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="316" text-anchor="middle" font-size="17" fill="#d06d4d">反向沿边反传：4 + 3 = 7</text></g></svg>
