name: PyTorch Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pytorch-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research and repository checks
        run: |
          python scripts/validate_structure.py
          python -m unittest discover -s .pi/skills/pytorch-research/tests -v
          python .pi/skills/pytorch-research/scripts/validate_research.py --repo .
      - name: Build curated site
        run: python scripts/build_pages.py --out _site
      - name: Install browser QA tooling
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - name: Static article QA
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          for p in json.loads(Path('catalog/posts.json').read_text())['posts']:
              subprocess.run([sys.executable, '.pi/skills/olah-style-paper-posts/scripts/validate.py', p['source']], check=True)
          PY
      - name: Browser and local-link QA
        run: python scripts/qa_pages.py _site --reports _qa
      - name: Archive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-qa
          path: _qa/
          if-no-files-found: warn
      - name: Upload curated Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
